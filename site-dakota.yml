---
# Setup inicial de um desktop Bluefin Dakota recém-instalado — índice das
# automações. Espelha site.yml (Fedora Atomic clássico), com uma
# diferença: o YubiKey usa versão própria em playbooks/dakota/, porque o
# Dakota é GNOME OS (não Fedora/RHEL) — sem `authselect`, sem RPMs,
# publicado como imagem bootc sobre backend composefs-oci (não
# rpm-ostree). Veja o cabeçalho de cada arquivo em playbooks/dakota/ e a
# seção "Bluefin Dakota" do README para detalhes.
#
# Todos os outros playbooks (bitwarden, zed, users, printer, neovim,
# capslock, keepassxc, bash) são os MESMOS arquivos usados por site.yml
# — não precisam de nenhuma adaptação para o Dakota.
#
# NÃO importa playbooks/homebrew.yml (tap ublue-os + casks do VSCode/Zed):
# no Dakota, o Zed continua gerenciado pelo `ujust` da própria imagem,
# então esse playbook (que também instalaria o Zed) seria redundante
# ali. O playbooks/zed.yml abaixo continua rodando — ele só configura o
# Podman como runtime de dev containers do Zed (settings.json), não
# instala nada.
#
# O VSCode NÃO é mais instalado via `ujust`/Homebrew aqui — veja
# playbooks/dakota/vscode.yml abaixo, que instala via snap (pressupõe
# snapd já disponível no host; falha graciosamente se não estiver).
#
# Rode só uma automação com `--tags <tag>`, ou pule uma com
# `--skip-tags <tag>`.
#
# Bitwarden e Proton Pass têm tag "never": não rodam com esse comando sem
# --tags, só sob pedido explícito (--tags bitwarden / --tags proton-pass).
#
# O libfprint NÃO é importado aqui — é uma automação totalmente à parte
# (só faz sentido em máquinas com o leitor Goodix 27c6:538d). Ela roda
# standalone por `just libfprint-dakota`, que chama
# playbooks/dakota/libfprint.yml direto — sem passar por este índice, e
# sem depender do submódulo git external/bluefin-distrobox-libfprint (o
# libfprint no Dakota é autocontido, veja playbooks/dakota/libfprint.yml).
#
# Uso: ./run-empowered.sh ansible-playbook site-dakota.yml
# (privilégio via run0 --empower — veja ansible.cfg e run-empowered.sh)
- name: Bitwarden — Flatpak + agente SSH + polkit (desbloqueio biométrico)
  # tag "never": não roda em `ansible-playbook site-dakota.yml` sem
  # --tags — só sob pedido explícito (--tags bitwarden / `just bitwarden-dakota`).
  ansible.builtin.import_playbook: playbooks/bitwarden.yml
  tags: [bitwarden, never]

- name: VSCode no Dakota — instalação via snap
  ansible.builtin.import_playbook: playbooks/dakota/vscode.yml
  tags: [vscode]

- name: Proton Pass CLI + injeção das chaves SSH no agente ativo
  # tag "never" (como o Bitwarden acima): não roda em `ansible-playbook
  # site-dakota.yml` sem --tags — só sob pedido explícito (--tags
  # proton-pass / `just proton-pass-dakota`), escolha específica de
  # gerenciador de senhas. Mesmo arquivo usado por site.yml — Homebrew
  # já vem pré-instalado no Dakota, nenhuma adaptação necessária.
  ansible.builtin.import_playbook: playbooks/proton-pass.yml
  tags: [proton-pass, never]

- name: Zed — Podman como runtime de dev containers
  ansible.builtin.import_playbook: playbooks/zed.yml
  tags: [zed]

- name: YubiKey no Dakota (pam_u2f em sudo/polkit + pcscd + import da chave GPG) + trava do KeePassXC
  # tag guarda-chuva "yubikey": inclui também a tag keepassxc-yubikey-lock
  # (falha graciosamente — avisa e pula — se o KeePassXC não estiver
  # instalado); veja o cabeçalho de playbooks/yubikey.yml.
  ansible.builtin.import_playbook: playbooks/dakota/yubikey.yml
  tags: [yubikey]

- name: Usuários adicionais do computador
  ansible.builtin.import_playbook: playbooks/users.yml
  tags: [users]

- name: Impressora EPSON L4160 (driverless)
  ansible.builtin.import_playbook: playbooks/printer.yml
  tags: [printer]

- name: Neovim + LazyVim
  ansible.builtin.import_playbook: playbooks/neovim.yml
  tags: [neovim]

# (o libfprint fica fora deste índice — veja o cabeçalho; roda por
# `just libfprint-dakota`, chamando playbooks/dakota/libfprint.yml direto.)

- name: Caps Lock via kanata (evdev, tap=Esc / hold=Ctrl)
  ansible.builtin.import_playbook: playbooks/capslock.yml
  tags: [capslock]

- name: KeePassXC — ponte de native messaging para o KeePassXC-Browser
  # tag "keepassxc": mantida por compatibilidade com o `keepassxc`
  # guarda-chuva anterior; hoje cobre só o bloco keepassxc-browser — a
  # trava ao remover a YubiKey está na tag yubikey acima.
  ansible.builtin.import_playbook: playbooks/keepassxc.yml
  tags: [keepassxc]

- name: Bash — completion case-insensitive, history-substring-search e ble.sh
  # tag guarda-chuva "bash": roda os dois blocos do playbook
  # (bash-completion, blesh); cada um também é selecionável isoladamente.
  ansible.builtin.import_playbook: playbooks/bash.yml
  tags: [bash]

- name: systemd-boot — boot flicker-free — loader.conf sem menu e com console-mode keep
  ansible.builtin.import_playbook: playbooks/systemd-boot.yml
  tags: [systemd-boot]

- name: ssh-askpass gráfico como padrão da sessão (PIN da YubiKey sem TTY)
  ansible.builtin.import_playbook: playbooks/ssh-askpass.yml
  tags: [ssh-askpass]

- name: Atalhos de teclado no estilo Omarchy (GNOME)
  # tag "never": muda atalhos da sessão inteira — só sob pedido explícito
  # (--tags omarchy-keybindings / `just omarchy-keybindings`). Para
  # desfazer, `just omarchy-keybindings-reset` (playbook standalone).
  ansible.builtin.import_playbook: playbooks/omarchy-keybindings.yml
  tags: [omarchy-keybindings, never]

- name: rclone — Google Drive (My Drive + Shared with Me)
  # tag "never": precisa das credenciais OAuth do Google — só sob
  # pedido explícito (--tags rclone-gdrive /
  # `just rclone-gdrive`).
  ansible.builtin.import_playbook: playbooks/rclone-gdrive.yml
  tags: [rclone-gdrive, never]
