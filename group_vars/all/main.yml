---
# Bitwarden (Flatpak)
bitwarden_flatpak_id: com.bitwarden.desktop
bitwarden_flatpak_remote: flathub
bitwarden_flatpak_method: system

# Agente SSH do Bitwarden — unidades systemd --user instaladas em
# ~/.config/systemd/user/ e camada estática em ~/.config/environment.d/
bitwarden_ssh_agent_units:
  - bitwarden-ssh-agent.path
  - bitwarden-ssh-agent-env.service

# gcr-ssh-agent compete pela variável SSH_AUTH_SOCK da sessão; precisa
# ficar mascarado para o agente do Bitwarden prevalecer.
gcr_ssh_agent_units:
  - gcr-ssh-agent.socket
  - gcr-ssh-agent.service

# Polkit action para desbloqueio biométrico do Bitwarden. Em sistemas
# imutáveis (Bluefin/Bazzite/Silverblue) /usr é somente leitura; o polkitd
# também busca actions em /usr/local/share/polkit-1/actions/ (gravável).
bitwarden_polkit_action_dest: /usr/local/share/polkit-1/actions/com.bitwarden.Bitwarden.policy

# Homebrew
homebrew_prefix: /home/linuxbrew/.linuxbrew

# Tap oficial do projeto ublue-os — fornece casks para apps que não podem
# ir para o homebrew-core/cask por licença (VSCode, Zed, etc.), empacotados
# para uso em desktops imutáveis.
ublue_homebrew_tap: ublue-os/homebrew-tap

# Casks instalados a partir do tap acima.
ublue_homebrew_casks:
  - "{{ ublue_homebrew_tap }}/visual-studio-code-linux"
  - "{{ ublue_homebrew_tap }}/zed-linux"

# Impressora EPSON L4160 — fila CUPS driverless (IPP Everywhere), sem
# instalar o driver ESC/P-R da Epson. printer_l4160_hostname é o mesmo
# hostname mDNS usado em lbssousa/nix-config
# (modules/system/hardware/printing.nix, deviceUri socket://); confirme
# com `avahi-resolve --name EPSONE0321F.local` ou `lpinfo -v` se a
# impressora tiver sido trocada/renomeada na rede.
printer_l4160_name: L4160
printer_l4160_location: "Wi-Fi"
printer_l4160_description: "EPSON L4160 Series"
printer_l4160_hostname: EPSONE0321F.local
printer_l4160_device_uri: "ipp://{{ printer_l4160_hostname }}:631/ipp/print"
printer_l4160_error_policy: abort-job
printer_l4160_set_default: true

# Neovim + LazyVim — configuração inicial via o starter oficial. Só é
# clonado se ~/.config/nvim ainda não existir (nunca sobrescreve uma
# config já presente, como a aplicada via dotfiles/stow).
lazyvim_starter_repo: https://github.com/LazyVim/starter.git

# YubiKey FIDO2/U2F — features do authselect mantidas em todos os modos
# (remova "with-fingerprint" se a máquina não tiver leitor biométrico —
# veja external/bluefin-distrobox-libfprint). A instalação do pacote
# pam-u2f fica fora desta automação (veja playbooks/yubikey.yml).
yubikey_authselect_base_features:
  - with-fingerprint
yubikey_pcscd_dropin: /etc/systemd/system/pcscd.service.d/udevadm-settle.conf

# Kanata — remapeamento do Caps Lock a nível evdev (tap=Esc, hold=Ctrl,
# Shift+tap=Caps Lock literal), via unidade systemd própria (não
# community.general.homebrew_services — veja o cabeçalho de
# playbooks/capslock.yml para o motivo). kanata_config_dest é a config
# pessoal do usuário atual e nunca é sobrescrita se já existir.
kanata_config_dest: "{{ ansible_facts.env.HOME }}/.config/kanata/kanata.kbd"
kanata_systemd_unit: /etc/systemd/system/kanata.service

# KeePassXC — trava todas as bases quando a YubiKey é removida (evento
# udev), via D-Bus (org.keepassxc.KeePassXC.MainWindow.lockAllDatabases).
# Requer o KeePassXC já instalado (fora do escopo desta automação — veja
# playbooks/keepassxc.yml) com a integração D-Bus habilitada (ativa por
# padrão).
#
# /var/usrlocal, não /usr/local: no Dakota (composefs-oci via bootc),
# /usr/local NÃO é gravável — é um diretório real embutido na imagem
# somente-leitura de /usr, ao contrário do OSTree clássico, onde
# /usr/local é o symlink gravável para /var/usrlocal (mesmo achado do
# playbooks/dakota/libfprint.yml). Como o script é só referenciado pelo
# caminho absoluto no RUN+= da regra udev — não precisa estar num
# diretório específico que algum outro programa procure —, apontar
# direto para /var/usrlocal/bin funciona igual nos dois sistemas: no
# Fedora Atomic é o mesmo arquivo físico de /usr/local/bin (symlink),
# no Dakota é o único lugar gravável.
keepassxc_yubikey_lock_script_dest: /var/usrlocal/bin/keepassxc-yubikey-lock.sh
keepassxc_yubikey_lock_udev_rule_dest: /etc/udev/rules.d/70-keepassxc-yubikey-lock.rules

# KeePassXC — ponte de native messaging entre o Flatpak do KeePassXC e os
# Flatpaks dos navegadores, para a extensão KeePassXC-Browser funcionar.
# Cada Flatpak só enxerga o próprio diretório de dados
# (~/.var/app/<id>/...), então o manifesto e o script wrapper são
# instalados DENTRO do diretório de cada navegador (visível ao sandbox
# dele mesmo), e o wrapper usa flatpak-spawn --host para rodar o
# keepassxc-proxy do Flatpak do KeePassXC no host. Veja
# playbooks/keepassxc.yml para detalhes.
keepassxc_browser_extension_firefox_id: keepassxc-browser@keepassxc.org
keepassxc_browser_extension_chrome_id: oboonakemofpalcgghocfoadofidjkkk
keepassxc_native_messaging_manifest_name: org.keepassxc.keepassxc_browser.json
keepassxc_native_messaging_targets:
  - flatpak_id: org.mozilla.firefox
    kind: firefox
  - flatpak_id: com.google.Chrome
    kind: chromium
    vendor_dir: google-chrome
  - flatpak_id: com.brave.Browser
    kind: chromium
    vendor_dir: BraveSoftware/Brave-Browser
  - flatpak_id: org.chromium.Chromium
    kind: chromium
    vendor_dir: chromium
  - flatpak_id: com.microsoft.Edge
    kind: chromium
    vendor_dir: microsoft-edge

# libfprint (goodix538d) no Bluefin Dakota — build autocontido em
# playbooks/dakota/libfprint.yml (sem depender do submódulo
# external/bluefin-distrobox-libfprint, que é rotulado para Fedora
# Atomic). Mesmas fontes e estratégia do submódulo: compilar num
# container distrobox descartável, instalar só num prefixo gravável.
#
# ATENÇÃO — verificado em hardware real: ao contrário do OSTree clássico
# (onde /usr/local é um symlink para /var/usrlocal, logo gravável), no
# Dakota (backend composefs-oci via bootc) /usr/local é um diretório de
# verdade embutido na imagem somente-leitura de /usr — grava lá falha com
# "Read-only file system". /var/usrlocal existe na imagem (gravável, no
# /var em btrfs), mas não é ligado a /usr/local por nenhum fstab/unit —
# por isso instalamos ali diretamente em vez de em /usr/local.
dakota_libfprint_container_name: libfprint-build
dakota_libfprint_distrobox_ini_file: "{{ inventory_dir }}/playbooks/files/dakota-libfprint-distrobox.ini"
dakota_libfprint_opencv_formula: opencv@4
dakota_libfprint_repo: https://github.com/lbssousa/libfprint.git
dakota_libfprint_ref: goodix-538d-sigfm-gtls
dakota_libfprint_checkout_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d"
dakota_libfprint_stage_dir: "{{ ansible_facts.env.HOME }}/src/libfprint-goodix538d-stage"
dakota_libfprint_usrlocal_prefix: /var/usrlocal
dakota_libfprint_usrlocal_libdir: "{{ dakota_libfprint_usrlocal_prefix }}/lib64"

# Bash — autocomplete case-insensitive e history-substring-search
# (~/.inputrc, recursos nativos do GNU Readline, funcionam com ou sem
# ble.sh) + ble.sh (syntax highlighting e autosuggestions, estilo
# Fish/zsh-autosuggestions, integrado no ~/.bashrc). Veja
# playbooks/bash.yml. ble.sh não tem formula no Homebrew — compilado a
# partir do código-fonte (make install), só precisa de make/gawk (também
# via Homebrew) no momento do build.
blesh_repo: https://github.com/akinomyoga/ble.sh.git
blesh_build_deps:
  - make
  - gawk
blesh_src_dir: "{{ ansible_facts.env.HOME }}/.local/share/ble.sh-src"
blesh_install_prefix: "{{ ansible_facts.env.HOME }}/.local"
blesh_entry: "{{ ansible_facts.env.HOME }}/.local/share/blesh/ble.sh"
