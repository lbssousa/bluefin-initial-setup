---
# Setup inicial de um desktop Bluefin/uBlue recém-instalado — índice das
# automações. Cada uma é um playbook próprio (em playbooks/, ou um
# submódulo git em external/), importado abaixo via import_playbook, o
# que faz todas rodarem dentro do mesmo `--ask-become-pass`.
#
# Rode só uma automação com `--tags <tag>`, ou pule uma com
# `--skip-tags <tag>` (ex.: máquinas sem a impressora ou sem o leitor
# biométrico). Veja o comentário de cada playbooks/*.yml para detalhes.
#
# Uso: ansible-playbook site.yml --ask-become-pass
# (requer o submódulo git inicializado: git submodule update --init)
- name: Bitwarden — Flatpak + agente SSH + polkit (desbloqueio biométrico)
  ansible.builtin.import_playbook: playbooks/bitwarden.yml
  tags: [bitwarden]

- name: Homebrew tap ublue-os + VSCode/Zed
  ansible.builtin.import_playbook: playbooks/homebrew.yml
  tags: [homebrew]

- name: Usuários adicionais do computador
  ansible.builtin.import_playbook: playbooks/users.yml
  tags: [users]

- name: Impressora EPSON L4160 (driverless)
  ansible.builtin.import_playbook: playbooks/printer.yml
  tags: [printer]

- name: Neovim + LazyVim
  ansible.builtin.import_playbook: playbooks/neovim.yml
  tags: [neovim]

- name: libfprint (goodix538d) — github.com/lbssousa/bluefin-distrobox-libfprint
  ansible.builtin.import_playbook: external/bluefin-distrobox-libfprint/site.yml
  tags: [libfprint]
