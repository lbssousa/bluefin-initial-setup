---
# YubiKey FIDO2/U2F — cada etapa é selecionável via tag (--tags
# yubikey-<etapa>), migrada das receitas just yubikey-* do repo
# lbssousa/dotfiles (fluxo atual, baseado em authselect — não do
# security/yubikey/setup.sh legado, que editava /etc/pam.d/system-auth
# via sed e desativava o authselect).
#
# Também inclui (tag keepassxc-yubikey-lock, no fim do arquivo) o
# gatilho que trava o KeePassXC ao remover a YubiKey da porta USB —
# mora aqui, não em playbooks/keepassxc.yml, porque é disparado pela
# YubiKey (regra udev casando o vendor Yubico), não por nada específico
# do KeePassXC. Ao contrário das etapas de PAM acima, essa tarefa NÃO
# falha se o KeePassXC não estiver instalado: como esta automação roda
# junto com as demais tags deste arquivo sob a tag guarda-chuva
# `yubikey` (`site.yml`/`site-dakota.yml`), um `ansible.builtin.fail`
# aqui interromperia o host para TODAS as plays seguintes de
# site.yml/site-dakota.yml (bash.yml incluso) — em vez disso, ela avisa
# e pula.
#
# A instalação do pacote pam-u2f fica FORA do escopo desta automação:
# o feature nativo "with-pam-u2f" do authselect espera o pam_u2f.so no
# caminho padrão do sistema, só alcançável via rpm-ostree install — o
# que violaria a regra deste repositório de nunca usar rpm-ostree
# (veja o README). Instale antes, manualmente:
#   just yubikey-install   (no dotfiles)
# ou diretamente:
#   sudo rpm-ostree install --idempotent pam-u2f
#   brew install libfido2
# seguido de reinicialização.
- name: YubiKey FIDO2/U2F + trava do KeePassXC ao remover a YubiKey
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Verificar se o pacote pam-u2f está instalado
      ansible.builtin.command: rpm -q pam-u2f
      register: pam_u2f_check
      changed_when: false
      failed_when: false
      tags: [yubikey-enroll, yubikey-setup-pam, yubikey-mode-replace, yubikey-mode-2fa, yubikey-test]

    - name: Verificar se o pamu2fcfg está disponível
      ansible.builtin.command: which pamu2fcfg
      register: pamu2fcfg_check
      changed_when: false
      failed_when: false
      tags: [yubikey-enroll, yubikey-setup-pam, yubikey-mode-replace, yubikey-mode-2fa, yubikey-test]

    - name: Falhar com orientação se o pam-u2f não estiver instalado
      ansible.builtin.fail:
        msg: >-
          pam-u2f (ou o binário pamu2fcfg) não encontrado. A instalação
          do pacote é manual e fica fora desta automação (evita
          rpm-ostree install — veja o cabeçalho de
          playbooks/yubikey.yml). Rode antes: `just yubikey-install` no
          dotfiles, ou `sudo rpm-ostree install --idempotent pam-u2f
          && brew install libfido2` seguido de reinicialização.
      when: >-
        pam_u2f_check.rc | default(1) != 0 or
        pamu2fcfg_check.rc | default(1) != 0
      tags: [yubikey-enroll, yubikey-setup-pam, yubikey-mode-replace, yubikey-mode-2fa, yubikey-test]

    - name: Verificar se o KeePassXC está instalado (Flatpak)
      ansible.builtin.command: flatpak info org.keepassxc.KeePassXC
      register: keepassxc_flatpak_check
      changed_when: false
      failed_when: false
      tags: [keepassxc-yubikey-lock]

    - name: Verificar se o KeePassXC está instalado (binário no PATH)
      ansible.builtin.command: which keepassxc
      register: keepassxc_bin_check
      changed_when: false
      failed_when: false
      tags: [keepassxc-yubikey-lock]

  tasks:
    # ── Registro da primeira YubiKey ──────────────────────────────────
    - name: Registro da YubiKey
      tags: [yubikey-enroll]
      block:
        - name: Verificar se já existe arquivo de chaves U2F
          ansible.builtin.stat:
            path: "{{ ansible_facts.env.HOME }}/.config/Yubico/u2f_keys"
          register: yubikey_keys_stat

        - name: Pedir para inserir a YubiKey
          ansible.builtin.pause:
            prompt: "Insira sua YubiKey na porta USB e pressione Enter para continuar"
          when: not yubikey_keys_stat.stat.exists

        - name: Garantir que ~/.config/Yubico existe
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/Yubico"
            state: directory
            mode: "0755"
          when: not yubikey_keys_stat.stat.exists

        - name: Registrar a YubiKey (toque a chave quando o LED piscar)
          ansible.builtin.shell: "umask 077; pamu2fcfg > {{ ansible_facts.env.HOME }}/.config/Yubico/u2f_keys"
          when: not yubikey_keys_stat.stat.exists
          changed_when: true

        - name: Gravar o origin do enrollment (hostname atual)
          ansible.builtin.copy:
            content: "pam://{{ ansible_facts.hostname }}\n"
            dest: "{{ ansible_facts.env.HOME }}/.config/Yubico/u2f_origin"
            mode: "0644"
          when: not yubikey_keys_stat.stat.exists

    # ── PAM via authselect (YubiKey substitui a senha) ────────────────
    # yubikey-setup-pam e yubikey-mode-replace aplicam exatamente o
    # mesmo perfil authselect (local + features base + with-pam-u2f) —
    # mesma ação do just, só com nomes diferentes por conveniência de
    # uso; aqui viram a mesma tarefa com as duas tags.
    - name: PAM via authselect — YubiKey substitui a senha
      tags: [yubikey-setup-pam, yubikey-mode-replace]
      become: true
      block:
        - name: Verificar perfil authselect atual
          ansible.builtin.command: authselect current --raw
          register: authselect_current
          changed_when: false
          failed_when: false

        - name: Aplicar perfil authselect (YubiKey substitui a senha)
          ansible.builtin.command: >-
            authselect select local
            {{ (yubikey_authselect_base_features + ['with-pam-u2f']) | join(' ') }}
            --force --backup=yubikey-{{ ansible_date_time.iso8601_basic_short }}
          when: >-
            authselect_current.rc != 0 or
            authselect_current.stdout_lines[0] | default('') != 'local' or
            (authselect_current.stdout_lines[1:] | sort) !=
              ((yubikey_authselect_base_features + ['with-pam-u2f']) | sort)
          changed_when: true

    # ── pcscd — corrige a YubiKey ficando invisível para o GnuPG ──────
    # Dois problemas distintos do pcsc-lite, ambos exigindo hoje um
    # `systemctl restart pcscd` manual sem esta automação:
    #   1. Corrida com o udev no BOOT (drop-in ExecStartPre=udevadm
    #      settle) — o pcscd inicia antes do kernel/udev terminarem de
    #      configurar o leitor CCID da YubiKey já conectada.
    #   2. pcscd não reconhecendo a YubiKey ao reconectar (replug) ou
    #      após suspender/retomar a máquina (regra udev
    #      yubikey-pcscd-restart.rules, ACTION=="add") — bug conhecido
    #      do pcsc-lite, não específico deste repositório; mais comum
    #      na prática que o problema (1), já que cobre qualquer momento
    #      depois do boot. Veja
    #      playbooks/templates/yubikey-pcscd-restart.rules.j2 para
    #      detalhes.
    - name: pcscd — aguardar udev settle no boot (YubiKey + GPG)
      tags: [yubikey-setup-pcscd]
      become: true
      block:
        - name: Garantir que o diretório do drop-in do pcscd existe
          ansible.builtin.file:
            path: "{{ yubikey_pcscd_dropin | dirname }}"
            state: directory
            mode: "0755"

        - name: Instalar o drop-in do pcscd
          ansible.builtin.copy:
            content: |
              [Service]
              ExecStartPre=/usr/bin/udevadm settle --timeout=5
            dest: "{{ yubikey_pcscd_dropin }}"
            mode: "0644"
          notify:
            - reload systemd
            - restart pcscd

        - name: Instalar a regra udev que reinicia o pcscd ao (re)conectar a YubiKey
          ansible.builtin.template:
            src: yubikey-pcscd-restart.rules.j2
            dest: "{{ yubikey_pcscd_restart_udev_rule_dest }}"
            owner: root
            group: root
            mode: "0644"
          notify:
            - reload udev rules
            - trigger udev

    # ── Modo 2FA (YubiKey + senha obrigatórios) ───────────────────────
    - name: PAM via authselect — modo 2FA (YubiKey + senha)
      tags: [yubikey-mode-2fa]
      become: true
      block:
        - name: Confirmar ativação do modo 2FA
          ansible.builtin.pause:
            prompt: "Ativar modo 2FA (YubiKey + senha obrigatórios)? Digite 'sim' para continuar"
          register: yubikey_2fa_confirm

        - name: Verificar perfil authselect atual
          ansible.builtin.command: authselect current --raw
          register: authselect_current_2fa
          changed_when: false
          failed_when: false
          when: yubikey_2fa_confirm.user_input | default('') | lower == 'sim'

        - name: Aplicar perfil authselect (modo 2FA)
          ansible.builtin.command: >-
            authselect select local
            {{ (yubikey_authselect_base_features + ['with-pam-u2f-2fa']) | join(' ') }}
            --force --backup=yubikey-{{ ansible_date_time.iso8601_basic_short }}
          when: >-
            yubikey_2fa_confirm.user_input | default('') | lower == 'sim' and
            (authselect_current_2fa.rc != 0 or
             authselect_current_2fa.stdout_lines[0] | default('') != 'local' or
             (authselect_current_2fa.stdout_lines[1:] | sort) !=
               ((yubikey_authselect_base_features + ['with-pam-u2f-2fa']) | sort))
          changed_when: true

    # ── Teste de autenticação ──────────────────────────────────────────
    # run0, não sudo: desde que este repositório passou a escalar
    # privilégio via run0 (ansible.cfg's become_method — veja
    # run-empowered.sh), testar "sudo" não verificaria mais o mecanismo
    # que o Ansible realmente usa. Diferente do sudo, run0 não tem um
    # "limpar cache" (não há `run0 -k`) — cada chamada de run0 fora de
    # um processo já empowered pede autenticação do zero, então não há
    # cache para limpar aqui.
    #
    # Rode esta tag ISOLADA (`ansible-playbook site.yml --tags
    # yubikey-test`, sem passar por run-empowered.sh) para um teste de
    # verdade: dentro de `just yubikey` (que roda sob `run0 --empower`
    # para as outras etapas desta automação — veja o Justfile) o
    # processo inteiro já está autenticado, e esta chamada de run0
    # passaria sem pedir nada, sem realmente exercitar a YubiKey.
    - name: Testar autenticação via run0 com a YubiKey
      tags: [yubikey-test]
      block:
        - name: Autenticar via run0 (toque a YubiKey quando solicitado)
          ansible.builtin.command:
            argv:
              - run0
              - "--description=Teste de autenticação da YubiKey (site.yml, tag yubikey-test)"
              - "true"
          changed_when: false
          failed_when: false
          register: yubikey_test_result

        - name: Reportar resultado do teste
          ansible.builtin.debug:
            msg: "Autenticação bem-sucedida!"
          when: yubikey_test_result.rc == 0

        - name: Reportar falha do teste
          ansible.builtin.debug:
            msg: >-
              Autenticação falhou. Verifique: YubiKey conectada (ykman
              list), chaves registradas
              (~/.config/Yubico/u2f_keys), o PAM (authselect current
              --raw) e se esta tag não foi rodada por engano dentro de
              um processo já `run0 --empower` (veja o comentário
              acima).
          when: yubikey_test_result.rc != 0

    # ── Reset — remove a configuração YubiKey do PAM ──────────────────
    - name: Reset — remover configuração YubiKey do authselect
      tags: [yubikey-reset]
      become: true
      block:
        - name: Confirmar reset da configuração YubiKey
          ansible.builtin.pause:
            prompt: >-
              Isto restaura o PAM ao estado anterior ao setup YubiKey
              (as chaves registradas NÃO são removidas). Digite 'sim'
              para continuar
          register: yubikey_reset_confirm

        - name: Localizar o backup authselect mais antigo do YubiKey
          ansible.builtin.find:
            paths: /var/lib/authselect/backups
            patterns: "yubikey-*"
            file_type: directory
          register: yubikey_backups
          when: yubikey_reset_confirm.user_input | default('') | lower == 'sim'

        - name: Restaurar o backup authselect mais antigo
          ansible.builtin.command: >-
            authselect backup-restore
            {{ (yubikey_backups.files | sort(attribute='path'))[0].path | basename }}
          when: >-
            yubikey_reset_confirm.user_input | default('') | lower == 'sim' and
            yubikey_backups.matched | default(0) > 0
          changed_when: true

        - name: Restaurar perfil local sem YubiKey (nenhum backup encontrado)
          ansible.builtin.command: >-
            authselect select local {{ yubikey_authselect_base_features | join(' ') }} --force
          when: >-
            yubikey_reset_confirm.user_input | default('') | lower == 'sim' and
            yubikey_backups.matched | default(0) == 0
          changed_when: true

    # ── KeePassXC — travar ao remover a YubiKey ────────────────────────
    # Trava todas as bases do KeePassXC quando a YubiKey é removida da
    # porta USB (evento udev "remove"), via chamada D-Bus a
    # org.keepassxc.KeePassXC.MainWindow.lockAllDatabases. Portado de
    # lbssousa/nix-config (modules/system/security/keepassxc-yubikey-lock.nix)
    # — mesmo mecanismo (script chamado por regra udev via systemd-run),
    # adaptado para um único usuário (o que roda este Ansible), não a
    # lista de usuários configurável do módulo NixOS original.
    #
    # A instalação do KeePassXC fica FORA do escopo desta automação
    # (mesmo raciocínio do pam-u2f acima): assume-se que o KeePassXC já
    # está instalado e rodando com a integração D-Bus habilitada (ativa
    # por padrão em Ferramentas > Configurações > Geral). Diferente do
    # pam-u2f, porém, a ausência do KeePassXC não é fatal aqui — ver
    # nota no cabeçalho do arquivo — a tarefa é simplesmente pulada.
    #
    # Desvio proposital do nix-config original: a regra udev casa
    # ENV{PRODUCT}=="1050/*" (qualquer produto do vendor Yubico), em vez
    # do produto específico "1050/407" hardcoded lá — cobre qualquer
    # modelo de YubiKey que o usuário conecte. Ver o cabeçalho de
    # playbooks/templates/keepassxc-yubikey-lock.rules.j2 para detalhes.
    - name: KeePassXC — travar ao remover a YubiKey
      become: true
      tags: [keepassxc-yubikey-lock]
      when: keepassxc_flatpak_check.rc == 0 or keepassxc_bin_check.rc == 0
      block:
        - name: Garantir que o diretório de destino do script existe
          ansible.builtin.file:
            path: "{{ keepassxc_yubikey_lock_script_dest | dirname }}"
            state: directory
            mode: "0755"

        - name: Instalar o script de travamento via D-Bus
          ansible.builtin.copy:
            src: keepassxc-yubikey-lock.sh
            dest: "{{ keepassxc_yubikey_lock_script_dest }}"
            owner: root
            group: root
            mode: "0755"

        - name: Instalar a regra udev (dispara na remoção da YubiKey)
          ansible.builtin.template:
            src: keepassxc-yubikey-lock.rules.j2
            dest: "{{ keepassxc_yubikey_lock_udev_rule_dest }}"
            owner: root
            group: root
            mode: "0644"
          notify:
            - reload udev rules
            - trigger udev

    - name: Avisar que o KeePassXC não foi encontrado (trava ao remover a YubiKey pulada)
      ansible.builtin.debug:
        msg: >-
          KeePassXC não encontrado (nem via Flatpak
          org.keepassxc.KeePassXC, nem no PATH) — pulando a automação
          de trava ao remover a YubiKey. Instale o KeePassXC, habilite
          Ferramentas > Configurações > Geral > "Habilitar integração
          com D-Bus" (ativa por padrão) e rode de novo com --tags
          keepassxc-yubikey-lock para habilitá-la.
      tags: [keepassxc-yubikey-lock]
      when: keepassxc_flatpak_check.rc != 0 and keepassxc_bin_check.rc != 0

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: reload systemd

    - name: restart pcscd
      ansible.builtin.systemd:
        name: pcscd
        state: restarted
      become: true
      listen: restart pcscd

    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      listen: reload udev rules

    - name: trigger udev
      ansible.builtin.command: udevadm trigger
      changed_when: false
      listen: trigger udev
