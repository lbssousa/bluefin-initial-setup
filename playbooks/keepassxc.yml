---
# KeePassXC — ponte de native messaging entre o Flatpak do KeePassXC e
# os Flatpaks dos navegadores, para a extensão KeePassXC-Browser
# funcionar. Cada Flatpak só enxerga o próprio diretório de dados
# (~/.var/app/<id>/...) e não consegue spawnar diretamente um processo
# de outro Flatpak — por isso o manifesto de native messaging e um
# script wrapper são instalados DENTRO do diretório do navegador
# (visível ao sandbox dele mesmo), e o wrapper usa flatpak-spawn --host
# para rodar o keepassxc-proxy do Flatpak do KeePassXC no host.
#
# A trava do KeePassXC ao remover a YubiKey (tag keepassxc-yubikey-lock)
# NÃO mora mais aqui — foi movida para playbooks/yubikey.yml e
# playbooks/dakota/yubikey.yml, já que é disparada pela YubiKey (regra
# udev), não por nada específico do KeePassXC; lá ela também falha
# graciosamente (avisa e pula) se o KeePassXC não estiver instalado, em
# vez do `ansible.builtin.fail` abaixo, que interromperia as plays
# seguintes de site.yml/site-dakota.yml para o host.
- name: KeePassXC — ponte de native messaging para o KeePassXC-Browser
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    # tags: keepassxc-browser (não "always"): esta play só tem esse
    # bloco desde que a trava ao remover a YubiKey mudou para
    # playbooks/yubikey.yml — "always" faria este precheck (e o fail
    # abaixo) rodar em QUALQUER `ansible-playbook site.yml --tags
    # <outra-coisa>`, mesmo tags sem nenhuma relação com KeePassXC (ex.:
    # `--tags neovim`), porque tasks "always" ignoram a tag pedida e só
    # respeitam --skip-tags always.
    - name: Verificar se o KeePassXC está instalado (Flatpak)
      ansible.builtin.command: flatpak info org.keepassxc.KeePassXC
      register: keepassxc_flatpak_check
      changed_when: false
      failed_when: false
      tags: keepassxc-browser

    - name: Verificar se o KeePassXC está instalado (binário no PATH)
      ansible.builtin.command: which keepassxc
      register: keepassxc_bin_check
      changed_when: false
      failed_when: false
      tags: keepassxc-browser

    - name: Falhar com orientação se o KeePassXC não for encontrado
      ansible.builtin.fail:
        msg: >-
          KeePassXC não encontrado (nem via Flatpak
          org.keepassxc.KeePassXC, nem no PATH). A instalação fica fora
          desta automação — instale-o antes e habilite Ferramentas >
          Configurações > Geral > "Habilitar integração com D-Bus"
          (ativa por padrão).
      when: keepassxc_flatpak_check.rc != 0 and keepassxc_bin_check.rc != 0
      tags: keepassxc-browser

    - name: Verificar quais navegadores Flatpak suportados estão instalados
      ansible.builtin.command: flatpak info {{ item.flatpak_id }}
      register: keepassxc_browser_precheck
      changed_when: false
      failed_when: false
      loop: "{{ keepassxc_native_messaging_targets }}"
      loop_control:
        label: "{{ item.flatpak_id }}"
      tags: keepassxc-browser

  tasks:
    # Um `block` não aceita `loop` diretamente em Ansible — por isso os
    # atributos loop/when/vars/tags abaixo são repetidos em cada task
    # individual, em vez de um block único.
    - name: Garantir que o diretório de dados do navegador existe (native messaging)
      ansible.builtin.file:
        path: "{{ keepassxc_proxy_host_dest | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ keepassxc_browser_precheck.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: item.rc == 0
      vars:
        keepassxc_proxy_host_dest: >-
          {{ ansible_facts.env.HOME }}/.var/app/{{ item.item.flatpak_id }}/data/keepassxc-proxy-host
      tags: keepassxc-browser

    - name: Instalar o wrapper flatpak-spawn (keepassxc-proxy-host)
      ansible.builtin.copy:
        src: keepassxc-proxy-host.sh
        dest: "{{ keepassxc_proxy_host_dest }}"
        mode: "0755"
      loop: "{{ keepassxc_browser_precheck.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: item.rc == 0
      vars:
        keepassxc_proxy_host_dest: >-
          {{ ansible_facts.env.HOME }}/.var/app/{{ item.item.flatpak_id }}/data/keepassxc-proxy-host
      tags: keepassxc-browser

    - name: Garantir que o diretório de native messaging hosts do navegador existe
      ansible.builtin.file:
        path: "{{ keepassxc_native_messaging_dir }}"
        state: directory
        mode: "0755"
      loop: "{{ keepassxc_browser_precheck.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: item.rc == 0
      vars:
        keepassxc_native_messaging_dir: >-
          {{ ansible_facts.env.HOME }}/.var/app/{{ item.item.flatpak_id }}/{{
          '.mozilla/native-messaging-hosts' if item.item.kind == 'firefox'
          else 'config/' + item.item.vendor_dir + '/NativeMessagingHosts' }}
      tags: keepassxc-browser

    - name: Instalar o manifesto de native messaging do KeePassXC-Browser
      ansible.builtin.template:
        src: org.keepassxc.keepassxc_browser.json.j2
        dest: "{{ keepassxc_native_messaging_dir }}/{{ keepassxc_native_messaging_manifest_name }}"
        mode: "0644"
      loop: "{{ keepassxc_browser_precheck.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: item.rc == 0
      vars:
        keepassxc_proxy_host_dest: >-
          {{ ansible_facts.env.HOME }}/.var/app/{{ item.item.flatpak_id }}/data/keepassxc-proxy-host
        keepassxc_native_messaging_dir: >-
          {{ ansible_facts.env.HOME }}/.var/app/{{ item.item.flatpak_id }}/{{
          '.mozilla/native-messaging-hosts' if item.item.kind == 'firefox'
          else 'config/' + item.item.vendor_dir + '/NativeMessagingHosts' }}
        # Nome de var limpo pro template — dentro do .j2, "item" seria o
        # item do loop desta TASK (o resultado do precheck, com o alvo
        # de verdade em item.item), não o alvo diretamente.
        keepassxc_browser_kind: "{{ item.item.kind }}"
      tags: keepassxc-browser

    - name: Conceder talk-name org.freedesktop.Flatpak ao navegador (permite flatpak-spawn --host)
      ansible.builtin.command: >-
        flatpak override --user --talk-name=org.freedesktop.Flatpak {{ item.item.flatpak_id }}
      loop: "{{ keepassxc_browser_precheck.results }}"
      loop_control:
        label: "{{ item.item.flatpak_id }}"
      when: item.rc == 0
      changed_when: true
      tags: keepassxc-browser
