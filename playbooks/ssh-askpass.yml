---
# ssh-askpass gráfico como padrão da sessão de usuário — para o ssh/git
# conseguirem pedir o PIN/passphrase (ex.: chave FIDO2 ed25519-sk da
# YubiKey) e mostrar o aviso "toque na chave" mesmo quando não há TTY
# (git push de dentro de IDE, Zed, VSCode…). Sem um askpass, o ssh falha
# com "incorrect passphrase supplied" ao tentar assinar com a chave.
#
# Usa o primeiro askpass gráfico encontrado entre os candidatos (no
# Bluefin/Dakota: gcr4-ssh-askpass, do GNOME, em /usr/libexec). Se
# nenhum existir, avisa e pula — não falha.
#
# Grava ~/.config/environment.d/30-ssh-askpass.conf, lido pelo
# systemd --user no início da sessão: vale para GNOME Shell e tudo que
# ele lança (terminal, IDEs). Só aparece numa NOVA sessão (logout/login).
# SSH_ASKPASS_REQUIRE=prefer faz o ssh usar o askpass mesmo com TTY
# (o padrão só o usaria sem terminal).
#
# Nível de usuário, sem root.
- name: ssh-askpass gráfico como padrão da sessão
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ssh_askpass_candidates:
      - /usr/libexec/gcr4-ssh-askpass
      - /usr/libexec/openssh/gnome-ssh-askpass
      - /usr/libexec/openssh/ssh-askpass
      - /usr/lib/ssh/ssh-askpass
      - /usr/bin/ssh-askpass
    ssh_askpass_require: prefer
    ssh_askpass_conf: "{{ lookup('env', 'HOME') }}/.config/environment.d/30-ssh-askpass.conf"

  tasks:
    - name: ssh-askpass gráfico
      tags: [ssh-askpass]
      block:
        - name: Procurar um ssh-askpass gráfico instalado
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: "{{ ssh_askpass_candidates }}"
          register: ssh_askpass_stats

        - name: Escolher o primeiro encontrado
          ansible.builtin.set_fact:
            ssh_askpass_bin: >-
              {{ ssh_askpass_stats.results
                 | selectattr('stat.exists') | map(attribute='item') | first | default('') }}

        - name: Avisar e pular se não houver nenhum
          ansible.builtin.debug:
            msg: >-
              Nenhum ssh-askpass gráfico encontrado (procurei
              {{ ssh_askpass_candidates | join(', ') }}). Nada a fazer.
          when: ssh_askpass_bin == ''

        - name: Configurar SSH_ASKPASS na sessão
          when: ssh_askpass_bin != ''
          block:
            - name: Criar ~/.config/environment.d
              ansible.builtin.file:
                path: "{{ ssh_askpass_conf | dirname }}"
                state: directory
                mode: "0755"

            - name: Definir SSH_ASKPASS e SSH_ASKPASS_REQUIRE
              ansible.builtin.copy:
                dest: "{{ ssh_askpass_conf }}"
                mode: "0644"
                content: |
                  # Gerenciado por playbooks/ssh-askpass.yml
                  SSH_ASKPASS={{ ssh_askpass_bin }}
                  SSH_ASKPASS_REQUIRE={{ ssh_askpass_require }}
