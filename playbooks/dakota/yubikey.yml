---
# YubiKey no Bluefin Dakota — versão de escopo reduzido de
# playbooks/yubikey.yml.
#
# O Dakota é GNOME OS (não Fedora/RHEL) — não tem `authselect`, a
# ferramenta que playbooks/yubikey.yml usa para trocar/reforçar o PAM
# globalmente. DELIBERADAMENTE FICAM DE FORA deste arquivo:
# `yubikey-mode-replace`, `yubikey-mode-2fa`, `yubikey-test`,
# `yubikey-reset` e a checagem de pacote `rpm -q pam-u2f` (Dakota não
# tem banco RPM). O PAM é configurado de forma localizada, só nos dois
# serviços que importam, pelas tarefas yubikey-enroll/yubikey-setup-pam
# abaixo; o pam_u2f entra no /etc/pam.d/system-auth logo depois do
# pam_fprintd (digital → YubiKey → senha).
#
# O que roda aqui:
#   - yubikey-enroll + yubikey-setup-pam (NOVO): registra a YubiKey em
#     ~/.config/Yubico/u2f_keys (pamu2fcfg) e adiciona
#     `auth sufficient pam_u2f.so cue nouserok` ao `system-auth`, após
#     o pam_fprintd (vale para sudo, login/GDM e `polkit-1`). O polkit-1 cobre pkexec e run0 (run0 autentica via
#     polkit, não por um serviço PAM próprio) — e é o que o diálogo do
#     agente polkit do GNOME usa. "sufficient" + "nouserok": tocar a
#     YubiKey basta (substitui a senha), mas se ela não estiver
#     conectada, ou o usuário não tiver chaves registradas, o PAM cai
#     para o fluxo normal (digital/senha) — nenhum risco de lockout. O
#     pam_u2f.so e o pamu2fcfg já vêm na imagem (nada instalado aqui);
#     se faltarem, a tarefa avisa e pula.
#   - yubikey-setup-pcscd: mesmo fix de playbooks/yubikey.yml para a
#     YubiKey ficando invisível para o GnuPG até reiniciar o pcscd na
#     mão — drop-in systemd (corrida com o udev no boot) + regra udev
#     (pcscd não reconhecendo a YubiKey ao reconectar/após suspender) —
#     nada específico de Fedora.
#   - yubikey-gpg-import (NOVO): importa a chave pública OpenPGP do
#     cartão da YubiKey (gpg --card-status / --edit-card fetch) para o
#     keyring local, útil para SSH/assinatura via GPG independente de
#     qualquer integração com o PAM do sistema. Também configura a
#     chave importada como `user.signingkey` no git (--global) e liga
#     `commit.gpgsign`/`tag.gpgsign`, para assinar commits e tags por
#     padrão com a YubiKey.
#   - keepassxc-yubikey-lock: mesmo gatilho de playbooks/yubikey.yml
#     (regra udev + script de trava via D-Bus quando a YubiKey é
#     removida) — genérico o bastante para não precisar de nenhuma
#     adaptação no Dakota. Se o KeePassXC não estiver instalado, a
#     tarefa avisa e pula (não falha) — ver o motivo no cabeçalho de
#     playbooks/yubikey.yml.
- name: YubiKey no Dakota (pam_u2f em sudo/polkit + pcscd + import da chave GPG) + trava do KeePassXC
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Procurar o módulo pam_u2f.so
      ansible.builtin.stat:
        path: "{{ yubikey_pam_u2f_module }}"
      register: yubikey_pam_u2f_stat
      tags: [yubikey-enroll, yubikey-setup-pam]

    - name: Verificar se o pamu2fcfg está disponível
      ansible.builtin.command: which pamu2fcfg
      register: yubikey_pamu2fcfg_check
      changed_when: false
      failed_when: false
      tags: [yubikey-enroll, yubikey-setup-pam]

    - name: Definir se o pam_u2f está utilizável
      ansible.builtin.set_fact:
        yubikey_pam_u2f_ok: "{{ yubikey_pam_u2f_stat.stat.exists and yubikey_pamu2fcfg_check.rc == 0 }}"
      tags: [yubikey-enroll, yubikey-setup-pam]

    - name: Avisar e pular se o pam_u2f/pamu2fcfg não estiverem na imagem
      ansible.builtin.debug:
        msg: >-
          pam_u2f.so ({{ yubikey_pam_u2f_module }}) e/ou pamu2fcfg não
          encontrados — pulando yubikey-enroll e yubikey-setup-pam. A
          instalação do pacote fica fora desta automação.
      when: not yubikey_pam_u2f_ok
      tags: [yubikey-enroll, yubikey-setup-pam]

    - name: Verificar se o KeePassXC está instalado (Flatpak)
      ansible.builtin.command: flatpak info org.keepassxc.KeePassXC
      register: keepassxc_flatpak_check
      changed_when: false
      failed_when: false
      tags: [keepassxc-yubikey-lock]

    - name: Verificar se o KeePassXC está instalado (binário no PATH)
      ansible.builtin.command: which keepassxc
      register: keepassxc_bin_check
      changed_when: false
      failed_when: false
      tags: [keepassxc-yubikey-lock]

  tasks:
    # ── Registro da primeira YubiKey ──────────────────────────────────
    # Mesma tarefa de playbooks/yubikey.yml (nada específico de distro).
    - name: Registro da YubiKey
      tags: [yubikey-enroll]
      when: yubikey_pam_u2f_ok
      block:
        # Arquivo vazio conta como "não registrado": uma tentativa que
        # falhou antes (redirecionamento do shell cria o arquivo mesmo se
        # o pamu2fcfg erra) não pode fazer as próximas execuções pularem
        # o registro.
        - name: Verificar se já existe arquivo de chaves U2F
          ansible.builtin.stat:
            path: "{{ yubikey_u2f_keys }}"
          register: yubikey_keys_stat

        - name: Definir se falta registrar a YubiKey
          ansible.builtin.set_fact:
            yubikey_needs_enroll: "{{ not yubikey_keys_stat.stat.exists or yubikey_keys_stat.stat.size == 0 }}"

        - name: Pedir para inserir a YubiKey
          ansible.builtin.pause:
            prompt: "Insira sua YubiKey na porta USB e pressione Enter para continuar"
          when: yubikey_needs_enroll

        # Sob o Ansible o pamu2fcfg não tem terminal para pedir o PIN
        # FIDO2 (falha com FIDO_ERR_INVALID_ARGUMENT); o PIN é lido aqui
        # (sem eco) e entregue pelo stdin. Se a YubiKey não pedir PIN, ele
        # é ignorado — pode deixar em branco.
        - name: Pedir o PIN FIDO2 da YubiKey (Enter se não houver PIN)
          ansible.builtin.pause:
            prompt: "PIN FIDO2 da YubiKey"
            echo: false
          register: yubikey_pin_prompt
          when: yubikey_needs_enroll

        - name: Garantir que ~/.config/Yubico existe
          ansible.builtin.file:
            path: "{{ yubikey_u2f_keys | dirname }}"
            state: directory
            mode: "0755"
          when: yubikey_needs_enroll

        - name: Registrar a YubiKey (toque a chave quando o LED piscar)
          # Grava em arquivo temporário e só então move: nunca deixa um
          # u2f_keys vazio/parcial se o pamu2fcfg falhar.
          ansible.builtin.shell: |
            set -e
            tmp=$(mktemp "{{ yubikey_u2f_keys }}.XXXXXX")
            trap 'rm -f "$tmp"' EXIT
            printf '%s\n' "$YUBIKEY_PIN" | pamu2fcfg > "$tmp"
            test -s "$tmp"
            mv "$tmp" "{{ yubikey_u2f_keys }}"
          args:
            executable: /bin/bash
          environment:
            YUBIKEY_PIN: "{{ yubikey_pin_prompt.user_input | default('') }}"
          when: yubikey_needs_enroll
          changed_when: true

    # ── PAM — YubiKey para sudo / pkexec / run0 / login ───────────────
    # Ordem de autenticação desejada: digital → YubiKey → senha. Como
    # `include` é atômico, a única forma de encaixar o pam_u2f entre o
    # pam_fprintd e o pam_unix é editar /etc/pam.d/system-auth (arquivo
    # local, sem cópia no vendordir), que sudo, polkit-1 (pkexec/run0 e
    # o agente do GNOME), login e GDM incluem. A linha vai logo depois
    # do pam_fprintd. "nouserok" + "sufficient": sem YubiKey conectada
    # ou sem chaves registradas, cai para a senha. Limitação: o
    # pam_fprintd só passa adiante após esgotar as tentativas/timeout.
    - name: PAM — pam_u2f no system-auth, depois da digital (sudo/polkit-1/login)
      tags: [yubikey-setup-pam]
      become: true
      when: yubikey_pam_u2f_ok
      block:
        # Migração: versões anteriores colocavam o pam_u2f ANTES do
        # system-auth em sudo e polkit-1 (YubiKey antes da digital).
        - name: Remover o bloco antigo do pam_u2f de sudo e polkit-1
          ansible.builtin.blockinfile:
            path: "/etc/pam.d/{{ item }}"
            marker: "# {mark} yubikey pam_u2f (playbooks/dakota/yubikey.yml)"
            state: absent
          loop:
            - sudo
            - polkit-1

        - name: Adicionar pam_u2f ao system-auth, logo após o pam_fprintd
          ansible.builtin.blockinfile:
            path: /etc/pam.d/system-auth
            marker: "# {mark} yubikey pam_u2f (playbooks/dakota/yubikey.yml)"
            insertafter: '^auth\s+sufficient\s+pam_fprintd\.so'
            block: "{{ yubikey_pam_u2f_line }}"
            mode: "0644"

        # O PAM do polkit NÃO roda no pkexec: roda no
        # polkit-agent-helper@.service (socket-activated), cujo sandbox
        # (PrivateDevices=yes, DevicePolicy=strict, ProtectHome=yes,
        # RestrictAddressFamilies=AF_UNIX) esconde o /dev/hidraw* da
        # YubiKey e o ~/.config/Yubico/u2f_keys — o pam_u2f falha em
        # silêncio e o PAM cai para digital/senha. Este drop-in abre só o
        # mínimo: dispositivos hidraw e de aleatoriedade, $HOME somente leitura e o
        # AF_NETLINK que o libudev/libfido2 usam para enumerar, e
        # /dev/urandom + /dev/random (o pam_u2f gera o desafio com eles;
        # sem isso falha com "Failed to generate challenge", visto com
        # `debug debug_file=syslog` no pam_u2f).
        - name: Garantir o diretório do drop-in do polkit-agent-helper
          ansible.builtin.file:
            path: "{{ yubikey_polkit_helper_dropin | dirname }}"
            state: directory
            mode: "0755"

        - name: Liberar a YubiKey e o u2f_keys no sandbox do polkit-agent-helper
          ansible.builtin.copy:
            dest: "{{ yubikey_polkit_helper_dropin }}"
            owner: root
            group: root
            mode: "0644"
            content: |
              # Gerenciado por playbooks/dakota/yubikey.yml (yubikey-setup-pam)
              [Service]
              PrivateDevices=no
              DeviceAllow=char-hidraw rw
              DeviceAllow=/dev/urandom r
              DeviceAllow=/dev/random r
              ProtectHome=read-only
              RestrictAddressFamilies=AF_UNIX AF_NETLINK
          notify: reload systemd

    # ── pcscd — corrige a YubiKey ficando invisível para o GnuPG ──────
    # Mesma automação de playbooks/yubikey.yml (ver o cabeçalho de lá
    # para detalhes) — nada específico do Dakota. Cobre dois problemas
    # distintos do pcsc-lite: a corrida com o udev no boot (drop-in
    # ExecStartPre=udevadm settle) e o pcscd não reconhecendo a YubiKey
    # ao reconectar/após suspender (regra udev yubikey-pcscd-restart.rules).
    - name: pcscd — aguardar udev settle no boot (YubiKey + GPG)
      tags: [yubikey-setup-pcscd]
      become: true
      block:
        - name: Garantir que o diretório do drop-in do pcscd existe
          ansible.builtin.file:
            path: "{{ yubikey_pcscd_dropin | dirname }}"
            state: directory
            mode: "0755"

        - name: Instalar o drop-in do pcscd
          ansible.builtin.copy:
            content: |
              [Service]
              ExecStartPre=/usr/bin/udevadm settle --timeout=5
            dest: "{{ yubikey_pcscd_dropin }}"
            mode: "0644"
          notify:
            - reload systemd
            - restart pcscd

        - name: Instalar a regra udev que reinicia o pcscd ao (re)conectar a YubiKey
          # Caminho absoluto, não "yubikey-pcscd-restart.rules.j2": o
          # módulo template busca em <diretório do playbook>/templates/
          # — playbooks/dakota/templates/, não playbooks/templates/,
          # onde o arquivo mora de fato (compartilhado com
          # playbooks/yubikey.yml). Mesma exceção documentada para
          # dakota-fprintd-override.conf.j2 em playbooks/dakota/libfprint.yml.
          ansible.builtin.template:
            src: "{{ inventory_dir }}/playbooks/templates/yubikey-pcscd-restart.rules.j2"
            dest: "{{ yubikey_pcscd_restart_udev_rule_dest }}"
            owner: root
            group: root
            mode: "0644"
          notify:
            - reload udev rules
            - trigger udev

        - name: Garantir que o diretório de módulos do p11-kit (OpenSC) existe
          ansible.builtin.file:
            path: /etc/pkcs11/modules
            state: directory
            mode: "0755"

        - name: Instalar override do módulo OpenSC (YubiKey exclusiva pro GnuPG)
          ansible.builtin.template:
            src: "{{ inventory_dir }}/playbooks/templates/opensc-p11-kit.module.j2"
            dest: /etc/pkcs11/modules/opensc.module
            owner: root
            group: root
            mode: "0644"

    # ── Importar a chave OpenPGP do cartão da YubiKey ──────────────────
    - name: Importar a chave pública OpenPGP do cartão da YubiKey
      tags: [yubikey-gpg-import]
      block:
        - name: Verificar o cartão OpenPGP da YubiKey (gpg --card-status)
          ansible.builtin.command: gpg --card-status
          register: yubikey_card_status
          changed_when: false
          failed_when: false

        - name: Falhar com orientação se nenhum cartão OpenPGP for detectado
          ansible.builtin.fail:
            msg: >-
              Nenhum cartão OpenPGP detectado (gpg --card-status falhou).
              Insira a YubiKey e rode de novo:
              ansible-playbook site-dakota.yml --tags yubikey-gpg-import
          when: yubikey_card_status.rc != 0

        - name: Extrair o fingerprint da chave de assinatura do cartão
          # O rótulo do gpg --card-status vem preenchido com pontos até a
          # coluna do ":" (ex.: "Signature key ....: XXXX..."), não só
          # espaços — por isso [.\s]* em vez de \s* antes do ":". E o
          # regex_search com grupo de captura retorna uma LISTA nesta
          # versão do Ansible (não uma string) — por isso extraímos o
          # trecho inteiro (label + fingerprint) SEM grupo, e removemos o
          # label depois com regex_replace, para não depender desse
          # comportamento.
          ansible.builtin.set_fact:
            yubikey_gpg_fingerprint: >-
              {{ (yubikey_card_status.stdout
                  | regex_search('Signature key[.\s]*:\s*[0-9A-F ]+')
                  | default('', true))
                 | regex_replace('^Signature key[.\s]*:\s*', '')
                 | replace(' ', '') }}
          when: yubikey_card_status.rc == 0

        - name: Falhar se não foi possível ler o fingerprint da chave de assinatura
          ansible.builtin.fail:
            msg: >-
              gpg --card-status não trouxe uma "Signature key" legível.
              Confira `gpg --card-status` manualmente antes de repetir
              esta automação.
          when:
            - yubikey_card_status.rc == 0
            - yubikey_gpg_fingerprint | default('') | length == 0

        - name: Verificar se a chave já está no keyring local
          ansible.builtin.command: "gpg --list-keys {{ yubikey_gpg_fingerprint }}"
          register: yubikey_gpg_list
          changed_when: false
          failed_when: false
          when: yubikey_gpg_fingerprint | default('') | length > 0

        - name: Importar a chave pública do cartão (gpg --edit-card fetch)
          # --no-tty: sem ele o gpg tenta abrir /dev/tty para o prompt
          # "gpg>" mesmo pilotado via --command-fd/--status-fd, e falha
          # rodando sob Ansible (sem terminal de controle). "fetch" não
          # pede senha/PIN, então não precisa de pinentry.
          ansible.builtin.shell: echo fetch | gpg --no-tty --command-fd=0 --status-fd=1 --edit-card
          when: >-
            yubikey_gpg_fingerprint | default('') | length > 0 and
            yubikey_gpg_list.rc != 0
          changed_when: true

        # ── Assinar commits/tags do git com a chave da YubiKey ─────────
        - name: Configurar a chave de assinatura GPG no git (--global)
          community.general.git_config:
            name: user.signingkey
            scope: global
            value: "{{ yubikey_gpg_fingerprint }}"
          when: yubikey_gpg_fingerprint | default('') | length > 0

        - name: Assinar commits automaticamente (git commit.gpgsign)
          community.general.git_config:
            name: commit.gpgsign
            scope: global
            value: "true"
          when: yubikey_gpg_fingerprint | default('') | length > 0

        - name: Assinar tags automaticamente (git tag.gpgsign)
          community.general.git_config:
            name: tag.gpgsign
            scope: global
            value: "true"
          when: yubikey_gpg_fingerprint | default('') | length > 0

    # ── KeePassXC — travar ao remover a YubiKey ────────────────────────
    # Mesma automação de playbooks/yubikey.yml (ver o cabeçalho de lá
    # para detalhes) — nada específico do Dakota.
    - name: KeePassXC — travar ao remover a YubiKey
      become: true
      tags: [keepassxc-yubikey-lock]
      when: keepassxc_flatpak_check.rc == 0 or keepassxc_bin_check.rc == 0
      block:
        - name: Garantir que o diretório de destino do script existe
          ansible.builtin.file:
            path: "{{ keepassxc_yubikey_lock_script_dest | dirname }}"
            state: directory
            mode: "0755"

        - name: Instalar o script de travamento via D-Bus
          # Caminho absoluto: copy também busca relativo a
          # playbooks/dakota/ (files/), não playbooks/files/, onde o
          # script mora de fato (compartilhado com playbooks/yubikey.yml).
          ansible.builtin.copy:
            src: "{{ inventory_dir }}/playbooks/files/keepassxc-yubikey-lock.sh"
            dest: "{{ keepassxc_yubikey_lock_script_dest }}"
            owner: root
            group: root
            mode: "0755"

        - name: Instalar a regra udev (dispara na remoção da YubiKey)
          # Caminho absoluto: mesmo motivo do "template" de
          # yubikey-pcscd-restart.rules.j2 acima — o arquivo mora em
          # playbooks/templates/, não playbooks/dakota/templates/.
          ansible.builtin.template:
            src: "{{ inventory_dir }}/playbooks/templates/keepassxc-yubikey-lock.rules.j2"
            dest: "{{ keepassxc_yubikey_lock_udev_rule_dest }}"
            owner: root
            group: root
            mode: "0644"
          notify:
            - reload udev rules
            - trigger udev

    - name: Avisar que o KeePassXC não foi encontrado (trava ao remover a YubiKey pulada)
      ansible.builtin.debug:
        msg: >-
          KeePassXC não encontrado (nem via Flatpak
          org.keepassxc.KeePassXC, nem no PATH) — pulando a automação
          de trava ao remover a YubiKey. Instale o KeePassXC, habilite
          Ferramentas > Configurações > Geral > "Habilitar integração
          com D-Bus" (ativa por padrão) e rode de novo com --tags
          keepassxc-yubikey-lock para habilitá-la.
      tags: [keepassxc-yubikey-lock]
      when: keepassxc_flatpak_check.rc != 0 and keepassxc_bin_check.rc != 0

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      listen: reload systemd

    - name: restart pcscd
      ansible.builtin.systemd:
        name: pcscd
        state: restarted
      become: true
      listen: restart pcscd

    - name: reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false
      become: true
      listen: reload udev rules

    - name: trigger udev
      ansible.builtin.command: udevadm trigger
      changed_when: false
      become: true
      listen: trigger udev
