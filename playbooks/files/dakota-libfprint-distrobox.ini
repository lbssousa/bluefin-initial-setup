# Definição declarativa (formato nativo do distrobox) do container "pet"
# usado para compilar o fork Goodix 538d do libfprint
# (https://github.com/lbssousa/libfprint) em playbooks/dakota/libfprint.yml.
# Portado de external/bluefin-distrobox-libfprint/distrobox.ini — mesma
# estratégia, agora autocontida neste repositório para o Bluefin Dakota
# (que não usa rpm-ostree/dnf no host, mas containers distrobox são
# independentes do host, então uma imagem baseada em Fedora toolbox
# funciona igual num host Dakota).
#
# O container monta /home/linuxbrew somente leitura para enxergar o
# opencv@4 do Homebrew (linuxbrew) instalado no host e linkar o libfprint
# contra ele, em vez de puxar o opencv-devel do Fedora — sem nunca tocar
# em /usr via layering.
[libfprint-build]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
volume=/home/linuxbrew:/home/linuxbrew:ro
additional_packages="meson gcc gcc-c++ ninja-build pkgconf-pkg-config openssl-devel glib2-devel gobject-introspection-devel libgudev-devel libgusb-devel systemd-devel systemd-udev nss-devel pixman-devel gtk-doc python3-cairo python3-gobject cairo-devel umockdev git cmake"
