---
# Neovim + LazyVim (configuração inicial)
#
# Instala o Neovim via Homebrew e, se ~/.config/nvim ainda não existir,
# clona o starter oficial do LazyVim nele, removendo o histórico git do
# template (recomendação oficial do LazyVim — ver
# https://www.lazyvim.org/installation). Uma config já existente (por
# exemplo aplicada via dotfiles/stow) nunca é sobrescrita.
#
# Além disso, instala em lua/plugins/ duas customizações próprias desta
# automação — cada uma só se o arquivo de destino ainda não existir
# (force: false), para nunca sobrescrever uma versão colocada manualmente
# (por exemplo copiada/symlinkada a partir de nvim/lua/plugins/*.lua no
# lbssousa/dotfiles, que não é aplicado automaticamente via stow — veja
# o README de lá):
#   - extras.lua: habilita o extra/preset de LaTeX do LazyVim (equivalente
#     a :LazyExtras > lang.tex — https://www.lazyvim.org/extras/lang/tex).
#     Requer uma distribuição LaTeX (ex.: TeX Live) e, opcionalmente,
#     texlab no PATH para os recursos de LSP; nenhum dos dois é instalado
#     por este playbook.
#   - gregorio.lua: instala o plugin AISCGre-BR/gregorio.nvim, para
#     notação litúrgica GABC/NABC (Gregorio) — carregado sob demanda
#     (ft = "gabc"). O dotfiles tem um gregorio.lua próprio (mais
#     elaborado, com LSP e treesitter customizados) sob o mesmo nome —
#     o force: false evita que este playbook substitua essa versão se
#     ela já tiver sido colocada manualmente.
- name: Neovim + LazyVim
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Garantir que o Homebrew (linuxbrew) está disponível
      ansible.builtin.stat:
        path: "{{ homebrew_prefix }}/bin/brew"
      register: brew_bin

    - name: Falhar com orientação se o Homebrew não for encontrado
      ansible.builtin.fail:
        msg: >-
          Homebrew não encontrado em {{ homebrew_prefix }}. Nas imagens
          uBlue/Bluefin ele já vem pré-instalado; em outras, instale-o
          primeiro (https://brew.sh).
      when: not brew_bin.stat.exists

  tasks:
    - name: Neovim + LazyVim
      block:
        - name: Instalar o Neovim via Homebrew
          community.general.homebrew:
            name: neovim
            state: present

        - name: Verificar se já existe configuração do Neovim
          ansible.builtin.stat:
            path: "{{ ansible_facts.env.HOME }}/.config/nvim"
          register: nvim_config_dir

        - name: Clonar o starter do LazyVim (configuração inicial)
          ansible.builtin.git:
            repo: "{{ lazyvim_starter_repo }}"
            dest: "{{ ansible_facts.env.HOME }}/.config/nvim"
            depth: 1
          when: not nvim_config_dir.stat.exists

        - name: Remover o histórico git do starter do LazyVim
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/nvim/.git"
            state: absent
          when: not nvim_config_dir.stat.exists

        - name: Garantir que lua/plugins existe
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/nvim/lua/plugins"
            state: directory
            mode: "0755"

        - name: Habilitar o extra (preset) do LazyVim para LaTeX
          ansible.builtin.copy:
            src: nvim-extras.lua
            dest: "{{ ansible_facts.env.HOME }}/.config/nvim/lua/plugins/extras.lua"
            mode: "0644"
            force: false

        - name: Instalar o plugin gregorio.nvim (notação litúrgica GABC/NABC)
          ansible.builtin.copy:
            src: nvim-gregorio.lua
            dest: "{{ ansible_facts.env.HOME }}/.config/nvim/lua/plugins/gregorio.lua"
            mode: "0644"
            force: false
