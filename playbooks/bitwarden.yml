---
# Bitwarden: Flatpak + agente SSH ligado à sessão + polkit para
# desbloqueio biométrico. Configuração de referência:
# github.com/lbssousa/dotfiles (pacote stow "bitwarden").
#
# O environment.d e as unidades systemd --user do agente SSH usam
# force: false — só são copiados se o destino ainda não existir. Numa
# máquina que já aplicou o dotfiles/stow, o destino já é um symlink
# válido para o mesmo conteúdo, então o Ansible não mexe nele (evita
# substituir o symlink por um arquivo normal). Isto bootstrapa só uma
# máquina nova, sem o dotfiles ainda aplicado — mesmo raciocínio do
# playbooks/neovim.yml. A polkit action é diferente: o pacote stow do
# dotfiles a exclui de propósito (precisa de root em /usr/local, fora
# do alcance do stow em $HOME), então ela continua sempre sincronizada
# via Ansible.
- name: Bitwarden — Flatpak + agente SSH + polkit (desbloqueio biométrico)
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Garantir que o flatpak está disponível
      ansible.builtin.command: flatpak --version
      register: flatpak_check
      changed_when: false

  tasks:
    - name: Bitwarden
      block:
        - name: Garantir que o remote Flathub está configurado
          community.general.flatpak_remote:
            name: flathub
            flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
            method: "{{ bitwarden_flatpak_method }}"
            state: present

        - name: Instalar o Bitwarden via Flatpak
          community.general.flatpak:
            name: "{{ bitwarden_flatpak_id }}"
            remote: "{{ bitwarden_flatpak_remote }}"
            method: "{{ bitwarden_flatpak_method }}"
            state: present

        - name: Criar ~/.config/environment.d
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/environment.d"
            state: directory
            mode: "0755"

        - name: Configurar SSH_AUTH_SOCK estático para IDEs e apps da sessão
          ansible.builtin.copy:
            src: 20-bitwarden-ssh-agent.conf
            dest: "{{ ansible_facts.env.HOME }}/.config/environment.d/20-bitwarden-ssh-agent.conf"
            mode: "0644"
            force: false

        - name: Criar ~/.config/systemd/user
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
            state: directory
            mode: "0755"

        - name: Instalar as unidades systemd --user do agente SSH do Bitwarden
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/{{ item }}"
            mode: "0644"
            force: false
          loop: "{{ bitwarden_ssh_agent_units }}"
          notify: reload systemd --user

        - name: Mascarar o gcr-ssh-agent (evita disputa por SSH_AUTH_SOCK)
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            masked: true
          loop: "{{ gcr_ssh_agent_units }}"

        - name: Habilitar o path unit do agente SSH do Bitwarden
          ansible.builtin.systemd:
            name: bitwarden-ssh-agent.path
            scope: user
            daemon_reload: true
            enabled: true
            state: started

        - name: Instalar a polkit action do Bitwarden (desbloqueio biométrico)
          ansible.builtin.copy:
            src: com.bitwarden.Bitwarden.policy
            dest: "{{ bitwarden_polkit_action_dest }}"
            owner: root
            group: root
            mode: "0644"
          become: true
          notify: reiniciar polkit
          tags: [bitwarden-polkit]

  handlers:
    - name: reload systemd --user
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      listen: reload systemd --user

    - name: reiniciar polkit
      ansible.builtin.systemd:
        name: polkit
        state: restarted
      become: true
      listen: reiniciar polkit
